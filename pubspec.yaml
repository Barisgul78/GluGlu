
name: gluglu
description: GluGlu - çölyak ve gluten hassasiyeti için glutensiz ürün ve mekan rehberi.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_fonts: ^6.1.0
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  shared_preferences: ^2.5.5
  go_router: ^14.6.2
  flutter_typeahead: ^6.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  percent_indicator: ^4.2.3
  flutter_riverpod: ^2.5.1
  bottom_picker: ^4.2.0
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#174F41"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  background_color_ios: "#174F41"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
